name: fastgpt-ocr-adapter

services:
  adapter:
    # 已发布的中间件镜像。使用其他镜像仓库时只替换这一行。
    image: crpi-g79ks4g398u6l56b.cn-hangzhou.personal.cr.aliyuncs.com/fastgpt-ocr-adapter/adapter:0.1.0
    restart: unless-stopped
    environment:
      # 对外鉴权：必须替换，并与 FastGPT 的 CUSTOM_PDF_PARSE_KEY 保持一致。
      FASTGPT_OCR_AUTH_TOKEN: REPLACE_WITH_RANDOM_TOKEN
      FASTGPT_OCR_REQUIRE_AUTH: "true"

      # 当前启用的处理驱动。下面默认选择 MinerU 3.4.4。
      FASTGPT_OCR_PROVIDER: mineru
      FASTGPT_OCR_API_PROFILE: mineru-api-v3
      FASTGPT_OCR_PROVIDER_VERSION: "3.4.4"

      # MinerU 驱动地址。OCR 在宿主机时可使用当前值；在其他机器时改成实际地址。
      MINERU_BASE_URL: http://host.docker.internal:8000

      # Marker 驱动参数。仅当 Provider 改成 marker 时使用。
      MARKER_BASE_URL: http://host.docker.internal:8000
      MARKER_FORCE_OCR: "false"
      MARKER_MODE: balanced
      MARKER_AUTH_TOKEN: ""

      # FastGPT 单次调用窗口为 600 秒，因此解析超时必须小于 600 秒。
      FASTGPT_OCR_TIMEOUT_SECONDS: "540"
      FASTGPT_OCR_MAX_FILE_BYTES: "52428800"
      FASTGPT_OCR_MAX_PAGES: "500"

      # 单进程有界队列。默认同时执行 1 个请求，额外等待 1 个请求。
      FASTGPT_OCR_MAX_CONCURRENT_REQUESTS: "1"
      FASTGPT_OCR_MAX_QUEUED_REQUESTS: "1"
      FASTGPT_OCR_QUEUE_TIMEOUT_SECONDS: "60"
    ports:
      # 会监听服务器所有网卡。请用防火墙只允许 FastGPT 服务器访问 8001。
      - "8001:8001"
    extra_hosts:
      # 让 Linux 容器可以访问部署在宿主机上的 OCR 服务。
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
