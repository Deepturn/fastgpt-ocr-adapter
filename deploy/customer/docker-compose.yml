name: fastgpt-ocr

services:
  mineru-core:
    # 必填：替换成客户能拉取的 MinerU Core 3.4.4 镜像地址。
    # 例如：ghcr.io/deepturn/fastgpt-mineru-core:3.4.4-cu129
    image: registry.example.com/fastgpt-mineru-core:3.4.4-cu129
    restart: unless-stopped
    environment:
      HOME: /models/home
      MINERU_MODEL_SOURCE: local
      MINERU_TOOLS_CONFIG_JSON: /models/mineru.json
      MINERU_API_OUTPUT_ROOT: /work/output
      MINERU_API_ENABLE_FASTAPI_DOCS: "0"
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_API_TASK_RETENTION_SECONDS: "900"
      MINERU_PROCESSING_WINDOW_SIZE: "1"
    volumes:
      - mineru-models:/models
    tmpfs:
      - /tmp:size=2g,mode=1777
      - /work/output:size=8g,mode=1777
    shm_size: 16gb
    cpus: 8
    mem_limit: 24g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 15s
      timeout: 10s
      start_period: 10m
      retries: 4

  adapter:
    # 已发布的适配器镜像。客户使用自己的仓库时替换这一行。
    image: crpi-g79ks4g398u6l56b.cn-hangzhou.personal.cr.aliyuncs.com/fastgpt-ocr-adapter/adapter:0.1.0
    restart: unless-stopped
    depends_on:
      mineru-core:
        condition: service_healthy
    environment:
      # 必填：生成方式为 openssl rand -hex 32，并复制给 FastGPT 的 CUSTOM_PDF_PARSE_KEY。
      FASTGPT_OCR_AUTH_TOKEN: REPLACE_WITH_RANDOM_TOKEN
      FASTGPT_OCR_REQUIRE_AUTH: "true"
      FASTGPT_OCR_TIMEOUT_SECONDS: "540"
      FASTGPT_OCR_MAX_FILE_BYTES: "52428800"
      FASTGPT_OCR_MAX_PAGES: "500"
      FASTGPT_OCR_MAX_CONCURRENT_REQUESTS: "1"
      FASTGPT_OCR_MAX_QUEUED_REQUESTS: "1"
      FASTGPT_OCR_QUEUE_TIMEOUT_SECONDS: "60"
      FASTGPT_OCR_PROVIDER: mineru
      FASTGPT_OCR_API_PROFILE: mineru-api-v3
      FASTGPT_OCR_PROVIDER_VERSION: 3.4.4
      MINERU_BASE_URL: http://mineru-core:8000
    ports:
      # FastGPT 在另一台机器时，把第一个 127.0.0.1 改为适配器服务器私网 IP。
      - "127.0.0.1:8001:8001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

volumes:
  mineru-models:
    name: fastgpt-ocr-mineru-models
