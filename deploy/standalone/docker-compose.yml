name: fastgpt-ocr-adapter

services:
  adapter:
    # 使用私有镜像仓库时，只替换这一行。
    image: ghcr.io/deepturn/fastgpt-ocr-adapter:0.1.0
    restart: unless-stopped
    environment:
      # 必须替换，并和 FastGPT 的 CUSTOM_PDF_PARSE_KEY 保持一致。
      FASTGPT_OCR_AUTH_TOKEN: REPLACE_WITH_RANDOM_TOKEN
      FASTGPT_OCR_REQUIRE_AUTH: "true"

      # 默认连接 MinerU 3.4.4。换 OCR 服务时，改这里的 Provider 和 Profile。
      FASTGPT_OCR_PROVIDER: mineru
      FASTGPT_OCR_API_PROFILE: mineru-api-v3
      FASTGPT_OCR_PROVIDER_VERSION: "3.4.4"

      # MinerU 服务地址。OCR 跑在其他机器上时，改成那台机器的私网地址。
      MINERU_BASE_URL: http://host.docker.internal:8000

      # Marker 参数。只有 FASTGPT_OCR_PROVIDER=marker 时才会用到。
      MARKER_BASE_URL: http://host.docker.internal:8000
      MARKER_FORCE_OCR: "false"
      MARKER_MODE: balanced
      MARKER_AUTH_TOKEN: ""

      # FastGPT 单次调用窗口通常是 600 秒，解析超时不要超过它。
      FASTGPT_OCR_TIMEOUT_SECONDS: "540"
      FASTGPT_OCR_MAX_FILE_BYTES: "52428800"
      FASTGPT_OCR_MAX_PAGES: "500"

      # 默认同时解析 1 个请求，额外允许 1 个请求排队。
      FASTGPT_OCR_MAX_CONCURRENT_REQUESTS: "1"
      FASTGPT_OCR_MAX_QUEUED_REQUESTS: "1"
      FASTGPT_OCR_QUEUE_TIMEOUT_SECONDS: "60"
    ports:
      # 会监听服务器所有网卡。生产环境建议只允许 FastGPT 服务器访问 8001。
      - "8001:8001"
    extra_hosts:
      # 让 Linux 容器能访问宿主机上的 OCR 服务。
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
