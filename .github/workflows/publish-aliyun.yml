name: Publish images to Alibaba ACR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Adapter image tag, for example 0.1.0
        required: true
        default: 0.1.0

permissions:
  contents: read

env:
  ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ACR settings
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          test -n "$ACR_REGISTRY" || { echo "ALIYUN_ACR_REGISTRY is missing"; exit 1; }
          test -n "$ACR_NAMESPACE" || { echo "ALIYUN_ACR_NAMESPACE is missing"; exit 1; }
          test -n "$ACR_USERNAME" || { echo "ALIYUN_ACR_USERNAME is missing"; exit 1; }
          test -n "$ACR_PASSWORD" || { echo "ALIYUN_ACR_PASSWORD is missing"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/adapter:${{ inputs.version }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/adapter:sha-${{ github.sha }}
