name: Mirror a released adapter image to Alibaba ACR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GHCR release version (without the v prefix)
        required: true
        type: string

permissions:
  contents: read

env:
  ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the released image and record its image ID
        id: source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          : "${ACR_REGISTRY:?Missing ALIYUN_ACR_REGISTRY}"
          : "${ACR_NAMESPACE:?Missing ALIYUN_ACR_NAMESPACE}"
          source="ghcr.io/deepturn/fastgpt-ocr-adapter:$VERSION"
          docker pull --platform linux/amd64 "$source"
          digest=$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "$source")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Mirror without rebuilding and verify by pulling
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          source="ghcr.io/deepturn/fastgpt-ocr-adapter:$VERSION"
          target="$ACR_REGISTRY/$ACR_NAMESPACE/adapter:$VERSION"
          docker tag "$source" "$target"
          docker push --platform linux/amd64 "$target"
          docker image rm "$target"
          docker pull --platform linux/amd64 "$target"
          test "$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "$target")" \
            = "$EXPECTED_DIGEST"
