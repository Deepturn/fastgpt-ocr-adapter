name: Publish tested 0.1.2 image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ALIYUN_ACR_NAMESPACE }}
      ADAPTER_IMAGE: ghcr.io/deepturn/fastgpt-ocr-adapter:0.1.2
      IMAGE_MANIFEST: sha256:84952b962c4af11a2276f87288a728cba61e6595e47de3d989e63d3d0f42710a
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Pull and verify the tested Alibaba ACR image
        run: |
          source="$ACR_REGISTRY/$ACR_NAMESPACE/adapter"
          docker pull --platform linux/amd64 "$source@$IMAGE_MANIFEST"
          test "$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "$source@$IMAGE_MANIFEST")" = "$IMAGE_MANIFEST"
          docker tag "$source@$IMAGE_MANIFEST" "$ADAPTER_IMAGE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push and pull GHCR image
        run: |
          docker push --platform linux/amd64 "$ADAPTER_IMAGE"
          docker image rm "$ADAPTER_IMAGE"
          docker pull --platform linux/amd64 "$ADAPTER_IMAGE"
          test "$(docker image inspect --platform linux/amd64 --format '{{.Id}}' "$ADAPTER_IMAGE")" = "$IMAGE_MANIFEST"
