name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check src tests
      - run: mypy src
      - run: PYTHONPATH=src pytest --cov-report=xml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: test "$(docker compose config --services)" = adapter

  adapter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: fastgpt-ocr-adapter:ci
      - name: Smoke-test the adapter without an OCR backend
        shell: bash
        run: |
          docker run --rm -d --name adapter-smoke --read-only \
            --tmpfs /tmp:size=256m,mode=1777 --cap-drop ALL \
            -e FASTGPT_OCR_AUTH_TOKEN=REPLACE_WITH_RANDOM_TOKEN \
            -p 127.0.0.1:8001:8001 fastgpt-ocr-adapter:ci
          trap 'docker stop adapter-smoke' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 \
            -fsS http://127.0.0.1:8001/health/live
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/health/ready)" = 503
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fastgpt-ocr-adapter:ci
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

  filesystem-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
