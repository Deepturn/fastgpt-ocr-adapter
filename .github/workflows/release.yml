name: Release images

on:
  push:
    tags:
      - "v*"
      - "!v0.1.2"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  ADAPTER_IMAGE: ghcr.io/deepturn/fastgpt-ocr-adapter

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "version = \"$version\"" pyproject.toml
          grep -Fx "__version__ = \"$version\"" src/fastgpt_ocr_adapter/__init__.py
          grep -Fx "    image: ${ADAPTER_IMAGE}:$version" docker-compose.yml
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.ADAPTER_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.ADAPTER_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Inspect published images
        run: docker buildx imagetools inspect "${ADAPTER_IMAGE}:sha-${GITHUB_SHA}"
