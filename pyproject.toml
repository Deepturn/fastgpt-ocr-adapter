[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastgpt-ocr-adapter"
version = "0.1.1"
description = "FastGPT-compatible HTTP adapter for local OCR and document parsing services"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.140.7",
  "httpx==0.28.1",
  "packaging==26.2",
  "pypdf==6.14.2",
  "python-multipart==0.0.32",
  "starlette==1.3.1",
  "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "pytest-cov==6.1.1",
  "ruff==0.11.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=fastgpt_ocr_adapter --cov-fail-under=90"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
