name: fastgpt-ocr-adapter

services:
  adapter:
    image: ghcr.io/deepturn/fastgpt-ocr-adapter:0.1.3
    restart: unless-stopped
    environment:
      FASTGPT_OCR_AUTH_TOKEN: "REPLACE_WITH_RANDOM_TOKEN"
      FASTGPT_OCR_REQUIRE_AUTH: "true"

      # Choose one provider, API profile and upstream version (see README).
      # Set both API_PROFILE and PROVIDER_VERSION to "auto" to detect a
      # supported MinerU version at startup.
      FASTGPT_OCR_PROVIDER: mineru
      FASTGPT_OCR_API_PROFILE: mineru-tasks-v1
      FASTGPT_OCR_PROVIDER_VERSION: "4.2.3"

      # Use the OCR service base URL, without an API endpoint suffix.
      MINERU_BASE_URL: "http://ocr.example.invalid:8000"
      MINERU_AUTH_TOKEN: ""
      MARKER_BASE_URL: "http://ocr.example.invalid:8000"
      MARKER_FORCE_OCR: "false"
      MARKER_MODE: balanced
      MARKER_AUTH_TOKEN: ""

      FASTGPT_OCR_TIMEOUT_SECONDS: "540"
      FASTGPT_OCR_MAX_FILE_BYTES: "52428800"
      FASTGPT_OCR_MAX_PAGES: "500"
      FASTGPT_OCR_MAX_CONCURRENT_REQUESTS: "1"
      FASTGPT_OCR_MAX_QUEUED_REQUESTS: "1"
      FASTGPT_OCR_QUEUE_TIMEOUT_SECONDS: "60"
    ports:
      # Replace 127.0.0.1 with the host's private IP if FastGPT is on another host.
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
